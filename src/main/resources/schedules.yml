# ==============================================================================
# RoyPodium - Schedules Configuration (schedules.yml)
# ==============================================================================
# Define unlimited named schedules. Link them to podiums in podiums.yml.
# Supported frequencies:
#   DAILY    - Runs once every day at 'time-start'
#   WEEKLY   - Runs on specific 'days' (MONDAY..SUNDAY) at 'time-start'
#   MONTHLY  - Runs on 'day-of-month' (1..31 or LAST) at 'time-start'
#   INTERVAL - Runs every 'interval' (e.g., 30m, 2h) anchored to 'time-start'
config-version: 1

schedules:
  daily_midnight:
    timezone: "UTC"
    frequency: "DAILY"
    time-start: "00:00:00"
    # Optional per-schedule override: SKIP, RUN_LATEST, RUN_ALL
    missed-policy: "RUN_LATEST"

  weekly_sunday:
    timezone: "America/New_York"
    frequency: "WEEKLY"
    days:
      - "SUNDAY"
    time-start: "20:00:00"
    missed-policy: "RUN_LATEST"

  hourly_cycle:
    timezone: "UTC"
    frequency: "INTERVAL"
    time-start: "00:00:00"
    interval: "1h"
    missed-policy: "SKIP"
