# ==============================================================================
# RoyPodium - Discord Webhook Configuration (discord.yml)
# ==============================================================================
# Send rich Discord Embed notifications after each scheduled leaderboard payout.
# SECURITY NOTE: Keep your webhook URLs secret! RoyPodium never logs or displays
# full webhook URLs in console, chat, GUI, or bStats.
config-version: 4

# Global toggle for Discord webhook notifications.
enabled: false

# Default webhook profile name (from 'webhooks:' below) used when a podium
# does not specify its own 'discord.webhooks' list.
default-webhook: "default"

# Define unlimited named webhook profiles.
webhooks:
  default:
    # Must be an HTTPS URL on an official Discord domain (discord.com / discordapp.com).
    url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    username: "RoyPodium"
    avatar-url: ""

rate-limit:
  # HTTP request timeout in seconds.
  timeout-seconds: 10
  # Maximum retry attempts on HTTP 429 (rate limit) or 5xx errors.
  max-retries: 3
  # Minimum delay (ms) between consecutive webhook HTTP requests.
  min-interval-ms: 1000
  # Maximum seconds to wait for queued webhook messages to flush on server shutdown/reload.
  shutdown-drain-seconds: 5

test:
  # Cooldown (seconds) between /roypodium webhook send commands.
  cooldown-seconds: 10

player-avatar:
  # Whether to allow player head avatar URLs in embed thumbnails.
  enabled: true
  # Customizable avatar URL template ({player} or {uuid}).
  url-template: "https://mc-heads.net/avatar/{player}/128"

# Configurable delivery status labels shown in Discord embeds.
status-labels:
  online: "Delivered"
  offline: "Queued (Offline)"
  skipped: "Skipped ({reason})"

# Configurable rank icons/medals for leaderboard positions.
rank-icons:
  "1": "🥇"
  "2": "🥈"
  "3": "🥉"
  default: "#{rank}"

# Embed layout template.
# Available variables:
#   {podium}, {podium_name}, {date}, {time}, {timezone},
#   {online_count}, {offline_count}, {skipped_count}, {total_count},
#   {rank}, {rank_icon}, {player}, {value}, {status}, {reason}
# PlaceholderAPI placeholders are also supported in title, description, and footer.
embed:
  color: "#FFD700"
  title: "{podium_name} — Payout Results"
  description: "Scheduled payout completed at {date} {time} ({timezone})."
  include-timestamp: true
  # Thumbnail mode: NONE, TOP_1_PLAYER, CUSTOM_URL
  thumbnail-mode: "TOP_1_PLAYER"
  thumbnail-url: ""
  field-title: "Leaderboard"
  entry-format: "{rank_icon} **#{rank}** {player} — **{value}** *({status})*"
  skipped-format: "{rank_icon} **#{rank}** {player} — {value} *(Skipped: {reason})*"
  include-skipped: true
  empty-message: "No eligible players were rewarded in this payout."
  footer: "RoyPodium • {online_count} online • {offline_count} queued • {skipped_count} skipped"
